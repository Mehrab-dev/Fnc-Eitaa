[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnceitaa"
version = "0.1.0"
description = "Async Eitaa toolkit with experimental account protocol support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5"]

[tool.setuptools.packages.find]
include = ["fnceitaa*"]

[tool.setuptools.package-data]
"fnceitaa.protocol" = ["*.json"]
